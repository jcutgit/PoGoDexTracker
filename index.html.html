<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dex Tracker</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3f5f7;--panel:#fff;--ink:#16202a;--mute:#6b7782;--line:#d9dfe5;--on:#0e7c86;--onink:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161c;--panel:#1a222a;--ink:#e8eef2;--mute:#8a98a4;--line:#2b3641;--on:#35c2c9;--onink:#06262a}}
:root[data-theme="dark"]{--bg:#10161c;--panel:#1a222a;--ink:#e8eef2;--mute:#8a98a4;--line:#2b3641;--on:#35c2c9;--onink:#06262a}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;background:var(--bg);padding:10px 12px 8px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.tabs button{flex:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 13px;border-radius:99px;font:inherit;font-weight:600}
.tabs button.on{background:var(--on);color:var(--onink);border-color:var(--on)}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.bar input,.bar select{flex:1 1 120px;min-width:0;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:8px 10px;font:inherit}
.bar .act{flex:1 1 auto;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:8px 10px;font:inherit}
.bar .act.sure{background:var(--on);color:var(--onink);border-color:var(--on)}
.count{width:100%;color:var(--mute);font-size:13px}
.count b{color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;padding:12px}
.t{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:6px 4px 8px;text-align:center;font:inherit;cursor:pointer;opacity:.38;filter:grayscale(1);content-visibility:auto;contain-intrinsic-size:110px}
.t.o{opacity:1;filter:none;border-color:var(--on)}
.art{position:relative;width:64px;height:64px;margin:0 auto 4px;border-radius:50%;display:grid;place-items:center;font-size:26px;font-weight:700;color:#fff}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.n{font-size:11px;color:var(--mute)}
.nm{font-size:12.5px;font-weight:600;overflow-wrap:anywhere}
.empty{padding:40px 16px;text-align:center;color:var(--mute)}
</style></head><body>

<div class="bar"><input id="q" type="search" placeholder="Search name or number">
<select id="gen"></select>
<select id="view"><option value="a">Show all</option><option value="n">Still needed</option><option value="o">Owned</option></select>
<button class="act" id="mk"></button><button class="act" id="cl"></button>
<div class="count" id="ct"></div></div></header>
<main><div class="grid" id="g"></div><div class="empty" id="em" hidden>Nothing matches. Try another search or view.</div></main>

const GENS=[[1,151],[152,251],[252,386],[387,493],[494,649],[650,721],[722,809],[810,905],[906,1025]];
const TABS=["Regular","Shiny","4\u2605","XXL","XXS","Lucky","Shadow","Purified","Mega","Gigantamax"];
let tab=0,data={},pend=null;
try{data=JSON.parse(localStorage.getItem("dex")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("dex",JSON.stringify(data))}catch(e){}};
const own=t=>data[t]||(data[t]={});
const $=id=>document.getElementById(id);
$("tabs").innerHTML=TABS.map((t,i)=>`<button data-i="${i}">${t}</button>`).join("");
$("gen").innerHTML='<option value="">All generations</option>'+GENS.map((g,i)=>`<option value="${i}">Gen ${i+1} (${g[0]}-${g[1]})</option>`).join("");
function range(){const v=$("gen").value;return v===""?[1,N.length]:[GENS[v][0],Math.min(GENS[v][1],N.length)]}
function render(){
 const o=own(TABS[tab]),[a,b]=range(),q=$("q").value.trim().toLowerCase(),v=$("view").value;
 [...$("tabs").children].forEach((e,i)=>e.classList.toggle("on",i===tab));
 let h="",shown=0,have=0,tot=b-a+1;
 for(let i=a;i<=b;i++){const has=!!o[i];if(has)have++;
  const nm=N[i-1];
  if(q&&!(nm.toLowerCase().includes(q)||String(i)===q))continue;
  if(v==="n"&&has||v==="o"&&!has)continue;
  shown++;
  h+=`<button class="t${has?" o":""}" data-i="${i}"><div class="art" style="background:hsl(${i*37%360} 45% 45%)">${nm[0]}<img loading="lazy" alt="" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${i}.png" onerror="this.remove()"></div><div class="n">#${i}</div><div class="nm">${nm}</div></button>`}
 $("g").innerHTML=h;$("em").hidden=shown>0;
 $("ct").innerHTML=`<b>${have}</b> of ${tot} owned in ${TABS[tab]}, <b>${tot-have}</b> still needed`;
 $("mk").textContent=pend==="m"?"Tap again to confirm":"Mark all owned";
 $("cl").textContent=pend==="c"?"Tap again to confirm":"Clear all";
 $("mk").classList.toggle("sure",pend==="m");$("cl").classList.toggle("sure",pend==="c");
}
$("tabs").onclick=e=>{const b=e.target.closest("button");if(b){tab=+b.dataset.i;pend=null;render()}};
$("g").onclick=e=>{const b=e.target.closest(".t");if(!b)return;const i=b.dataset.i,o=own(TABS[tab]);
 if(o[i])delete o[i];else o[i]=1;save();
 if($("view").value==="a"){b.classList.toggle("o",!!o[i]);const [x,y]=range();let c=0;for(let k=x;k<=y;k++)if(o[k])c++;$("ct").innerHTML=`<b>${c}</b> of ${y-x+1} owned in ${TABS[tab]}, <b>${y-x+1-c}</b> still needed`}else render()};
function bulk(kind){if(pend!==kind){pend=kind;render();return}
 const o=own(TABS[tab]),[a,b]=range();for(let i=a;i<=b;i++){if(kind==="m")o[i]=1;else delete o[i]}
 pend=null;save();render()}
$("mk").onclick=()=>bulk("m");$("cl").onclick=()=>bulk("c");
["q","gen","view"].forEach(id=>$(id).addEventListener(id==="q"?"input":"change",()=>{pend=null;render()}));
render();
</script></body></html>
